name: Update references

# About 4 runs a month. A run with nothing to update opens no pull request.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Update nhsuk-frontend to the latest release
        run: npm install nhsuk-frontend@latest

      - id: version
        run: echo "nhsuk-frontend=$(node -p "require('nhsuk-frontend/package.json').version")" >> "$GITHUB_OUTPUT"

      # Includes npm test, so a release that breaks the docs fails here rather than opening a pull request
      - name: Regenerate references
        run: npm run reference

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.nhsuk-frontend }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to update"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C update-references
          git add -A
          git commit -m "Update references for nhsuk-frontend v$VERSION"
          git push --force origin update-references

          gh pr view update-references --json state --jq '.state' | grep -q OPEN \
            || gh pr create \
              --title "Update references for nhsuk-frontend v$VERSION" \
              --body "Regenerated with \`npm run reference\`. Check the diff for new or deprecated parameters, and whether the guides need updating."
